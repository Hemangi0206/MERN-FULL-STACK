<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend align="left">BASIC FORM</legend>
        <form>
<label for="fullName"> Full Name: </label>
<input type="text" name="yourName" id="fullName" placeholder="ENTER YOUR NAME">
<br><br>
<label for=email">Email: </label>
<input type="email" name="email" id="email" placeholder="ENTER YOUR EMAIL">
<br><br>
<label for="password">Password: </label>
<input type="password" name="password" id="password" placeholder="ENTER YOUR PASSWORD">
<br><br>
<label for="dob">Date of Birth</label>
<input type="date" name="dob" id="dob" placeholder="Enter Your Date">

<br>
<br>

<label for="time">Time of Birth</label>
<input type="time" name="time" id="time" placeholder="Time of Birth">
<br>
<br>
<label for="joiningtime"> Joining Time</label>
<input type="datetime-local" name="joiningtime" id="joiningtime" placeholder="Enter joining Time">
<br>
<br>
<label for="volume">volume</label>
<input type="range" name="volume" id="volume" min="0" max="10" value="3">
<br><br>
<label for="mobile">Mobile No.:</label>
<input type="number" name="mobile" id="mobile" placeholder="Enter Mobile No.">
<br><br>
<label for="resume">Resume</label>
<input type="file" name="resume" id="resume">
<br><br>
<label for="address">Address</label>
<textarea name="address" id="address"></textarea>
<br><br>
<label for="gender">Gender:</label>
    <input type="radio" name="gender" id="male" value="male">
    <span>male</span>
    <input type="radio" name="gender" id="female" value="female">
    <span>female</span>
    <input type="radio" name="gender" id="other" value="other">
    <span>other</span>
    <br>
    <br>
<label for="courses">courses</label>
<select name="course" id="courses">
    <option value="">--Select Course--</option>
    <option value="B-tech">B-Tech</option>
    <option value="bba">BBA</option>
    <option value="pharmacy">Pharmacy</option>
    <option value="Mba">MBA</option>
    <br>
    <br>
    
    <label for="skillset">skillset:</label>
    <input type="checkbox" name="skillset" id="java" value="java">
    <span>Java</span>
    <input type="checkbox" name="skillset" id="dasa" value="dasa">
    <span>DASA</span>
    <input type="checkbox" name="skillset" id="html" value="html">
    <span>HTML</span>
    <br>
    <br>
</select>
<button>submit</button>
<br><br>
    </form>
    </fieldset>
</body>
</html>
