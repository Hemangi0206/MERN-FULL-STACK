<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Appointment Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="main">

        <!-- Doctor Image -->
        <div class="image">

            <img src="doctor.jpg" alt="Doctor">

        </div>


        <!-- Appointment Form -->
        <div class="form">

            <h2>Doctor Appointment Form</h2>

            <hr>

            <form>

                <div class="row">
                    <label>Appointment Date</label>
                    <input type="date">
                </div>


                <div class="row">
                    <label>Appointment Time</label>
                    <input type="time">
                </div>


                <div class="row">
                    <label>Name</label>

                    <input type="text" placeholder="First">

                    <input type="text" placeholder="Last">
                </div>


                <div class="row">
                    <label>Gender</label>

                    Male
                    <input type="radio" name="gender">

                    Female
                    <input type="radio" name="gender">
                </div>


                <div class="row">
                    <label>Phone</label>

                    <input type="text" placeholder="####">
                </div>


                <div class="row">
                    <label>Address</label>

                    <input type="text" placeholder="city">

                    <input type="text" placeholder="state">
                </div>


                <div class="row query">
                    <label>Your Query</label>

                    <textarea></textarea>
                </div>


                <div class="appointment">

                    <label>Appointment Type</label>

                    <div class="types">

                        Select which appointment type(s) you require

                        <br>

                        <input type="checkbox">
                        Cervix checkup

                        <br>

                        <input type="checkbox">
                        Heart checkup

                        <br>

                        <input type="checkbox">
                        Eye check-up

                        <br>

                        <input type="checkbox">
                        Hearing Test

                    </div>

                </div>


                <button type="submit">Send</button>

            </form>

        </div>

    </div>

</body>

</html>
