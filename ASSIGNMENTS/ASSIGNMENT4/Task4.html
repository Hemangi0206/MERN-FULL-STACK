<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>

    <form>

        <table border="1" width="100%" cellspacing="1" cellpadding="3">

            <!-- Heading -->
            <tr>
                <th colspan="4">
                    Registration Form
                </th>
            </tr>

            <!-- Student Name -->
            <tr>
                <td>Student Name</td>

                <td>
                    <input type="text" placeholder="First Name">
                </td>

                <td>
                    <input type="text" placeholder="Middle Name">
                </td>

                <td>
                    <input type="text" placeholder="Last Name">
                </td>
            </tr>

            <!-- Father's and Mother's Name -->
            <tr>
                <td>Father's Name</td>

                <td>
                    <input type="text"
                           placeholder="Enter your father's Name">
                </td>

                <td>Mother's Name</td>

                <td>
                    <input type="text"
                           placeholder="Enter your Mother's Name">
                </td>
            </tr>

            <!-- DOB and Gender -->
            <tr>
                <td>Date of Birth</td>

                <td>
                    <input type="date">
                </td>

                <td>Gender</td>

                <td>
                    Male
                    <input type="radio" name="gender">

                    Female
                    <input type="radio" name="gender">
                </td>
            </tr>

            <!-- Category and Handicapped -->
            <tr>
                <td>Category</td>

                <td>
                    Gen
                    <input type="radio" name="category">

                    OBC
                    <input type="radio" name="category">

                    SC/ST
                    <input type="radio" name="category">
                </td>

                <td>Handicapped</td>

                <td>
                    Yes
                    <input type="radio" name="handicapped">

                    No
                    <input type="radio" name="handicapped">
                </td>
            </tr>

            <!-- Ex-Serviceman and EWS -->
            <tr>
                <td>Ex-Serviceman</td>

                <td>
                    Yes
                    <input type="radio" name="exserviceman">

                    No
                    <input type="radio" name="exserviceman">
                </td>

                <td>EWS</td>

                <td>
                    Yes
                    <input type="radio" name="ews">

                    No
                    <input type="radio" name="ews">
                </td>
            </tr>

            <!-- Email and Mobile -->
            <tr>
                <td>Email ID</td>

                <td>
                    <input type="email">
                </td>

                <td>Mobile No.</td>

                <td>
                    <input type="text">
                </td>
            </tr>

            <!-- State and City -->
            <tr>
                <td>State</td>

                <td>
                    <select>
                        <option>Select any One</option>
                    </select>
                </td>

                <td>City</td>

                <td>
                    <select>
                        <option>Select any One</option>
                    </select>
                </td>
            </tr>

            <!-- Photo and Signature -->
            <tr>
                <td>Upload Photo</td>

                <td>
                    <input type="file">
                </td>

                <td>Upload Signature</td>

                <td>
                    <input type="file">
                </td>
            </tr>

            <!-- Submit -->
            <tr>
                <td></td>

                <td colspan="3" align="center">
                    <input type="submit" value="Submit">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
