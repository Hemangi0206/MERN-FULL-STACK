<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Form</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div id="main">
      <div class="title">APPLICATION FORM</div>

      <fieldset>
        <legend>Personal Details</legend>

        <div class="personal-grid">
          <label>Applicant's full name</label>

          <div>
            <select class="select-medium">
              <option>--Select--</option>
            </select>

            <input type="text" class="input-small" />
          </div>

          <label>Care Of</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="care" />
              Parents
            </label>

            <label>
              <input type="radio" name="care" />
              Guardian
            </label>
          </div>

          <label>Father's Name</label>

          <div>
            <select class="select-small">
              <option>Mr.</option>
            </select>

            <input type="text" class="input-medium" />
          </div>

          <label>Mother's Name</label>

          <div>
            <select class="select-small">
              <option>Mrs.</option>
            </select>

            <input type="text" class="input-medium" />
          </div>

          <label>Gender</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="gender" />
              Male
            </label>

            <label>
              <input type="radio" name="gender" />
              Female
            </label>

            <label>
              <input type="radio" name="gender" />
              Others
            </label>
          </div>

          <label>Date of Birth</label>

          <div>
            <input type="date" />
          </div>

          <label>Marital Status</label>

          <div>
            <select class="select-medium">
              <option>--Select--</option>
            </select>
          </div>

          <label>Category</label>

          <div>
            <select class="select-medium">
              <option>--Select--</option>
            </select>
          </div>

          <label>Handicapped</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="handicapped" />
              No
            </label>

            <label>
              <input type="radio" name="handicapped" />
              Yes
            </label>
          </div>

          <label>Ex-Serviceman</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="ex" />
              No
            </label>

            <label>
              <input type="radio" name="ex" />
              Yes
            </label>
          </div>

          <label>EWS</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="ews" />
              No
            </label>

            <label>
              <input type="radio" name="ews" />
              Yes
            </label>
          </div>

          <label>Religion</label>

          <div>
            <select class="select-medium">
              <option>--Select--</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Contact Details</legend>

        <div class="contact-grid">
          <label>Mobile Number</label>

          <div>
            <input type="text" class="contact-input" />
          </div>

          <label>Email ID</label>

          <div>
            <input type="text" class="contact-input" />
          </div>

          <label>Address Line 1</label>

          <div>
            <input type="text" class="contact-input" />
          </div>

          <label>Address Line 2</label>

          <div>
            <input type="text" class="contact-input" />
          </div>

          <label>City</label>

          <div>
            <input type="text" class="contact-input" />
          </div>

          <label>State</label>

          <div>
            <select class="state">
              <option>--Select--</option>
            </select>
          </div>

          <label>Pin Code</label>

          <div>
            <input type="text" class="contact-input" />
          </div>
        </div>
      </fieldset>

        <legend>Qualification Details</legend>

        <div class="qualification-grid">
          <div class="heading">Sr No.</div>
          <div class="heading">Qualification</div>

          <div>

          <div>

          <div>

          <div>

          <div>

              <option>--Select--</option>
            </select>
          </div>

          <div>
            <input type="text" />
          </div>

          <div>
            <input type="number" />
          </div>

          <div>
            <input type="number" />
          </div>

          <div>
            <input type="number" />
          </div>

          <div>
            <input type="number" />
          </div>

          <!-- ROW 4 -->

          <div class="number">4</div>

          <div>
            <select>
              <option>--Select--</option>
            </select>
          </div>

          <div>
            <input type="text" />
          </div>

          <div>
            <input type="number" />
          </div>

          <div>
            <input type="number" />
          </div>

          <div>
            <input type="number" />
          </div>

          <div>
            <input type="number" />
          </div>
        </div>
      </fieldset>

    
      <fieldset>
        <legend>Language Knowledge</legend>

        <div class="language-grid">
          <div class="language-heading">Language</div>
          <div class="language-heading">Reading</div>
          <div class="language-heading">Writing</div>
          <div class="language-heading">Spoken</div>

          <div>Hindi</div>

          <div>

        <div class="identification-grid">
          <label>Adhar Card Number</label>

          <div>
            <input type="text" />

          <label>Upload Photo</label>

          <div>
            <input type="file" />

          <label>Upload Signature</label>

          <div>
            <input type="file" />

        </div>
      </fieldset>

      <div class="buttons">
        <button type="submit">Submit</button>

        <button type="button">Back</button>
      </div>
    </div>

</html>
