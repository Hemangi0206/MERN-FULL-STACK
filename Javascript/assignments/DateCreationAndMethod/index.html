<!doctype html>

<html>
  <head>
    <title>RICR Date Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <h1>RICR Student Admission Date Manager</h1>

      <button onclick="showAdmissionDates()">Show Admission Dates</button>

      <p id="admissionResult">Admission dates will appear here.</p>
    </div>

    <div class="box">
      <h1>RICR Assignment Deadline Manager</h1>

      <button onclick="manageDeadline()">Manage Deadline</button>

      <p id="deadlineResult">Assignment deadlines will appear here.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
