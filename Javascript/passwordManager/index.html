<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Manager</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-primary px-4 py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#">
          <i class="bi bi-shield-lock-fill me-2"></i>
          Password Manager
        </a>

        <span class="text-white">
          <i class="bi bi-key-fill me-1"></i>
          Secure Your Passwords
        </span>
      </div>
    </nav>

    <div class="container py-5">
      <div class="mb-4">
        <h2 class="fw-bold">My Passwords</h2>

        <p class="text-secondary">
          Manage all your website passwords in one place.
        </p>
      </div>

      <section class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 fw-bold">
            <i class="bi bi-plus-circle text-primary me-2"></i>
            Add New Password
          </h5>
        </div>

        <div class="card-body p-4">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="websiteName" class="form-label"> Website Name </label>

              <input
                type="text"
                id="websiteName"
                class="form-control"
                placeholder="Example: Google"
              />
            </div>
            <div class="col-md-6">
              <label for="userName" class="form-label">
                Username / Email
              </label>

              <input
                type="text"
                id="userName"
                class="form-control"
                placeholder="Enter username"
              />
            </div>
            <div class="col-md-6">
              <label for="password" class="form-label"> Password </label>

              <div class="input-group">
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Enter password"
                />

                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  onclick="TogglePassword('password', 'passwordIcon')"
                >
                  <i class="bi bi-eye" id="passwordIcon"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6">
              <label for="cfPassword" class="form-label">
                Confirm Password
              </label>

              <div class="input-group">
                <input
                  type="password"
                  id="cfPassword"
                  class="form-control"
                  placeholder="Confirm password"
                />

                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  onclick="TogglePassword('cfPassword', 'cfPasswordIcon')"
                >
                  <i class="bi bi-eye" id="cfPasswordIcon"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <button class="btn btn-light border" onclick="ClearForm()">
              <i class="bi bi-arrow-counterclockwise me-1"></i>
              Clear
            </button>

            <button class="btn btn-primary px-4" onclick="SavePassword()">
              <i class="bi bi-save me-1"></i>
              Save Password
            </button>
          </div>
        </div>
      </section>
      <section class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
          <div class="row align-items-center g-3">
            <div class="col-md-6">
              <h5 class="fw-bold mb-0">
                <i class="bi bi-shield-check text-primary me-2"></i>
                Saved Passwords
              </h5>
            </div>

            <div class="col-md-6">
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search website or username..."
                oninput="SearchPassword()"
              />
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="d-flex justify-content-between mb-3">
            <span class="text-secondary">
              Total Passwords:
              <strong id="totalCount">0</strong>
            </span>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-primary">
                <tr>
                  <th>S.No</th>
                  <th>Website</th>
                  <th>Username</th>
                  <th>Password</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="dataTable" class="text-center"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
