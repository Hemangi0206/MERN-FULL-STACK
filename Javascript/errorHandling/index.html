<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Marks Validation System</title>
  </head>
  <body>
    <h1>Student Marks Validation and Result System</h1>

    <label for="marks">Enter Student Marks (0-100):</label>
    <input type="number" id="marks" />

    <button type="button" id="checkResult">Calculate Result</button>

    <p id="result"></p>
    <p id="errorMessage"></p>
    <p id="processMessage"></p>

    <script src="script.js"></script>
  </body>
</html>
